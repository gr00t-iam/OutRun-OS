set timeout=2
set default=0

# The desktop session. `desktop` on the kernel command line is what selects it;
# without that word this same kernel boots the regression battery instead.
#
# Module ORDER matters for one reason only: the first module remains "the user
# ELF" that every existing suite loads, so user_init.elf must stay first. The
# applications are found by NAME (mod_find), not by position.
menuentry "Outrun OS — Desktop Session (1.0.0-metal)" {
    multiboot2 /boot/outrun-kernel.elf desktop
    module2 /boot/user_init.elf user_init.elf
    module2 /boot/apps/vault_pad.elf vault_pad.elf
    module2 /boot/apps/calc.elf calc.elf
    module2 /boot/apps/task_mgr.elf task_mgr.elf
    module2 /boot/apps/settings.elf settings.elf
    boot
}

menuentry "Outrun OS — Regression Suites (no desktop)" {
    multiboot2 /boot/outrun-kernel.elf
    module2 /boot/user_init.elf user_init.elf
    boot
}
